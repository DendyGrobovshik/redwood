import app.cash.redwood.buildsupport.AndroidDeviceTests

import static app.cash.redwood.buildsupport.TargetGroup.TreehouseHost

redwoodBuild {
  targets(TreehouseHost + AndroidDeviceTests.Enable)
  publishing()
}

// Ensure clean removes all CMake and native lib build artifacts
tasks.named('clean') {
  doLast {
    delete('.cxx')
    delete("${buildDir}/intermediates/cxx")
    delete("${buildDir}/intermediates/library_and_local_jars_jni")
    delete("${buildDir}/intermediates/merged_native_libs")
    delete("${buildDir}/intermediates/stripped_native_libs")
  }
}

afterEvaluate {
  publishing.publications.matching { it.name == 'kotlinMultiplatform' }.configureEach {
    artifact(tasks.named('bundleReleaseAar'))
  }
}

apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply plugin: 'io.github.tret9.zipline'

// Resolve libquickjs.so from zipline-android AAR via Maven.
configurations.create('quickjsAar') {
  canBeConsumed = false
  transitive = false
}
dependencies {
  quickjsAar("io.github.tret9:zipline-android:1.28.0-composelive-0.11-SNAPSHOT")
}
def quickjsAarFile = configurations.quickjsAar.elements.map { it.first().asFile }

tasks.register('extractQuickjsJni') {
  notCompatibleWithConfigurationCache('Uses project.copy in doLast')
  def outDir = layout.buildDirectory.dir('quickjs-jni')
  inputs.files(quickjsAarFile).withPropertyName('quickjsAar')
  outputs.dir(outDir)
  doLast {
    copy {
      from(zipTree(quickjsAarFile.get()))
      include('jni/**')
      eachFile { it.path = it.path.replaceFirst('jni/', '') }
      into(outDir.get().asFile)
    }
  }
}

kotlin {
  sourceSets {
    commonMain {
      dependencies {
        api libs.kotlinx.coroutines.core
        api libs.kotlinx.serialization.json
        api libs.okio
        api libs.zipline
        api libs.zipline.loader
        api projects.redwoodProtocol
        api projects.redwoodProtocolHost
        api projects.redwoodTreehouse
        api projects.redwoodUiCoreApi
      }
    }

    androidMain {
      dependencies {
        api libs.okhttp
        implementation libs.androidx.activity
      }
    }

    commonTest {
      dependencies {
        implementation libs.assertk
        implementation libs.kotlin.test
        implementation libs.kotlinx.coroutines.test
        implementation libs.okio
        implementation libs.turbine
        implementation libs.androidx.collection
        implementation projects.redwoodLayoutTesting
        implementation projects.redwoodLazylayoutTesting
        implementation projects.redwoodUiCoreTesting
        implementation projects.redwoodUiCoreCompose
        implementation projects.redwoodWidget
        implementation projects.testApp.schema.protocolGuest
        implementation projects.testApp.schema.protocolHost
        implementation projects.testApp.schema.testing
      }
    }
    androidUnitTest {
      dependencies {
        implementation libs.robolectric
      }
    }
    jvmTest {
      if (!rootProject.hasProperty('redwoodNoApps')) {
        kotlin.srcDir('src/appsJvmTest/kotlin')
        dependencies {
          implementation projects.testApp.presenterTreehouse
        }
      }
    }
  }
}

dependencies {
  androidTestImplementation libs.junit
  androidTestImplementation libs.turbine
  androidTestImplementation libs.androidx.test.runner
  androidTestImplementation libs.kotlinx.coroutines.test
  androidTestImplementation libs.assertk
  androidTestImplementation projects.redwoodLayoutTesting
  androidTestImplementation projects.redwoodLazylayoutTesting
  androidTestImplementation projects.redwoodUiCoreCompose
  androidTestImplementation projects.testApp.schema.protocolGuest
  androidTestImplementation projects.testApp.schema.protocolHost
  androidTestImplementation projects.testApp.schema.testing

  // The kotlin.test library provides JVM variants for multiple testing frameworks. The Kotlin
  // plugin does not apply the capability to configurations created by the Android plugin.
  androidTestImplementation libs.kotlin.test.junit
}

android {
  namespace = 'app.cash.treehouse.host'

  sourceSets {
    androidTest {
      java.srcDir('src/commonTest/kotlin')
    }
  }

  defaultConfig {
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

    externalNativeBuild {
      cmake {
        arguments "-DQUICKJS_JNI_DIR=${layout.buildDirectory.dir('quickjs-jni').get().asFile.absolutePath}"
      }
    }
  }

  externalNativeBuild {
    cmake {
      path = file('src/androidMain/cpp/CMakeLists.txt')
    }
  }
  packaging {
    jniLibs {
      excludes += ['**/libquickjs.so']
    }
  }

  // Ensure bridge source files are generated before CMake configure.
  afterEvaluate {
    tasks.matching { it.name.startsWith('buildCMake') || it.name.contains('ConfigureCMake') }.configureEach {
      dependsOn(extractQuickjsJni,
                ':redwood-protocol-host:compileKotlinJvm',
                ':redwood-protocol:compileKotlinJvm',
                ':redwood-runtime:compileKotlinJvm')
    }
  }


  tasks.matching { it.name == "compileKotlinIosSimulatorArm64" }.configureEach {
    dependsOn(':redwood-protocol-host:compileKotlinJvm')
  }

  // Generate _AllBridges.kt from redwood bridge module exports
  tasks.register('genAllBridges') {
    notCompatibleWithConfigurationCache("Uses project references")
    dependsOn(':redwood-protocol-host:compileKotlinJvm')
    dependsOn(':redwood-protocol:compileKotlinJvm')
    dependsOn(':redwood-runtime:compileKotlinJvm')
    outputs.upToDateWhen { false }
    doLast {
      def outFile = file("src/iosMain/kotlin/app/cash/redwood/treehouse/_AllBridges.kt")
      def retainVals = []
      def exportsDirs = [
        file("${rootDir}/redwood-protocol-host/build/generated/bridge/native"),
        file("${rootDir}/redwood-protocol/build/generated/bridge/native"),
        file("${rootDir}/redwood-runtime/build/generated/bridge/native"),
      ]
      for (dir in exportsDirs) {
        def f = new File(dir, "_bridge_exports.txt")
        if (!f.exists()) throw new RuntimeException("genAllBridges: exports file not found: $f")
        def lines = f.readLines().findAll { !it.isBlank() }
        if (lines.isEmpty()) throw new RuntimeException("genAllBridges: exports file is empty: $f")
        retainVals.addAll(lines)
      }
      def names = retainVals.unique().sort()
      outFile.parentFile.mkdirs()
      outFile.text = '@file:Suppress("unused")\n\n' +
        'package app.cash.redwood.treehouse\n\n' +
        names.collect { "import generated_bridges.$it" }.join('\n') + '\n\n' +
        'internal object _AllBridges {\n' +
        '    init {\n' +
        names.collect { "        ${it}()" }.join('\n') + '\n' +
        '    }\n' +
        '}\n'
    }
  }
  tasks.matching { it.name.startsWith("compileKotlinIos") }.configureEach {
    dependsOn('genAllBridges')
  }

  // Needed for unit tests which use ViewCompat whose static fields reference `R.id`s.
  androidResources.enable = true
}

// TreehouseTester expects to load our test application.
if (!rootProject.hasProperty('redwoodNoApps')) {
  tasks.withType(Test.class).configureEach {
    it.dependsOn(":test-app:presenter-treehouse:compileDevelopmentExecutableKotlinJsZipline")
  }
}
